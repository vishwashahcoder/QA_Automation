<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: linear-gradient(135deg, #121214, #1a1a24);
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h2 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: #a78bfa;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .description {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      font-weight: 700;
    }
    input {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 10px 12px;
      color: #f4f4f5;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }
    button {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover {
      opacity: 0.95;
    }
    button:active {
      transform: scale(0.98);
    }
    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.2);
      color: #c084fc;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #a78bfa;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.5; }
    }
  </style>
</head>
<body>
  <h2>📷 Activity Tracker</h2>
  <div class="description">
    Screenshots will only be captured when you perform actions on the target domain below.
  </div>
  
  <div class="form-group">
    <label for="targetUrl">Target System / Tab URL</label>
    <input type="text" id="targetUrl" placeholder="e.g. http://localhost:4500" />
  </div>
  
  <button id="saveBtn">Save Target Settings</button>
  
  <div class="status">
    <div class="status-dot"></div>
    <span id="statusText">Loading...</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
